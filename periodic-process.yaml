apiVersion: batch/v1
kind: CronJob
metadata:
  name: periodic-process
  namespace: gitops-review
spec:
  schedule: '* * * * *'
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: periodic-process
              image: registry.access.redhat.com/ubi9/ubi:latest
              command:
                - echo
                - hello
          restartPolicy: OnFailure
